# MIKU Phase 9 - Tuned Real-Time Working Scenarios SFT Configuration (Iteration 2)
# Fine-tunes checkpoint step_0000300 with tuned LR (3.5e-5) for higher accuracy on action schemas

model:
  preset: tiny
  vocab_size: 32000
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  weight_tie_embeddings: true
  rope_theta: 10000.0

tokenizer:
  model_prefix: data/processed/tokenizer/miku_bpe
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995

data:
  train_jsonl: data/processed/sft_scenarios/train_scenarios.jsonl
  val_jsonl: data/processed/sft_scenarios/val_scenarios.jsonl
  max_seq_len: 256

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  num_workers: 0

  optimizer: adamw
  learning_rate: 3.5e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  lr_warmup_steps: 20
  lr_min_factor: 0.1
  max_steps: 200

  dtype: auto
  checkpoint_dir: checkpoints/phase9_scenarios_sft_tuned
  checkpoint_every_n_steps: 50
  sample_every_n_steps: 50
  sample_max_new_tokens: 60
  sample_temperature: 0.7
  sample_top_p: 0.9
  sample_prompts:
    - "Instruction:\nEnable dark mode in Windows settings.\n\nResponse:\n"
    - "Instruction:\nOpen VS Code and load the project folder.\n\nResponse:\n"
    - "Instruction:\nOpen Calculator, calculate math result, paste into Notepad, and terminate.\n\nResponse:\n"
    - "Instruction:\nOpen MS Paint, pick red brush, draw circle in center, and save as miku_art.png.\n\nResponse:\n"
    - "Instruction:\nWhat is the capital of Japan?\n\nResponse:\n"

  log_dir: logs/phase9_scenarios_sft_tuned
  log_every_n_steps: 25
