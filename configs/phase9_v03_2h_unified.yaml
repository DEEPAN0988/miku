# MIKU Phase 9 — 2-Hour Grand Unified SFT Configuration
# Multi-domain continuous fine-tuning on 37,000+ unified samples

model:
  preset: tiny
  vocab_size: 32000
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  weight_tie_embeddings: true
  rope_theta: 10000.0

tokenizer:
  model_prefix: data/processed/tokenizer/miku_bpe
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995

data:
  train_jsonl: data/processed/sft_v03_unified/train_unified.jsonl
  val_jsonl: data/processed/sft_v03_unified/val_unified.jsonl
  max_seq_len: 256

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  num_workers: 0

  optimizer: adamw
  learning_rate: 2.5e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0

  max_duration_hours: 2.0
  max_steps: 100000
  warmup_seconds: 360
  lr_warmup_steps: 100
  lr_min_factor: 0.1
  checkpoint_every_seconds: 600
  checkpoint_every_n_steps: 2500

  dtype: auto
  checkpoint_dir: checkpoints/phase9_v03_2h_unified
  sample_every_n_steps: 2500
  sample_max_new_tokens: 60
  sample_temperature: 0.7
  sample_top_p: 0.9
  sample_prompts:
    - "Instruction:\nEnable dark mode in Windows settings.\n\nResponse:\n"
    - "Instruction:\nOpen VS Code and load the project folder.\n\nResponse:\n"
    - "Instruction:\nCalculate 72 * 4 in Calculator and paste into Notepad.\n\nResponse:\n"
    - "Instruction:\nPlay the song dynamic_theme on Spotify.\n\nResponse:\n"
    - "Instruction:\nWhat is the capital of Japan?\n\nResponse:\n"

  log_dir: logs/phase9_v03_2h_unified
  log_every_n_steps: 50
