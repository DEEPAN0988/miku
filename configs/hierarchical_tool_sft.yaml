# MIKU Hierarchical Tool-Calling SFT Configuration
# Tests whether two-stage (Category -> Action) routing improves OOD generalization at 14 tools

model:
  preset: tiny
  vocab_size: 32000
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  weight_tie_embeddings: true
  rope_theta: 10000.0

tokenizer:
  model_prefix: data/processed/tokenizer/miku_bpe
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995

data:
  train_jsonl: data/processed/sft_hierarchical/train.jsonl
  val_jsonl: data/processed/sft_hierarchical/val.jsonl
  max_seq_len: 256

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  num_workers: 0

  optimizer: adamw
  learning_rate: 8.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  lr_warmup_steps: 50
  lr_min_factor: 0.1
  max_steps: 600

  dtype: auto
  checkpoint_dir: checkpoints/hierarchical_tool_sft
  checkpoint_every_n_steps: 50
  sample_every_n_steps: 50
  sample_max_new_tokens: 35
  sample_temperature: 0.7
  sample_top_p: 0.9
  sample_prompts:
    - "Instruction:\nPlay the music.\n\nResponse:\n"
    - "Instruction:\nWhat time is it right now?\n\nResponse:\n"
    - "Instruction:\nOpen the calculator.\n\nResponse:\n"
    - "Instruction:\nSearch the web for weather forecast.\n\nResponse:\n"
    - "Instruction:\nSet volume to 50%.\n\nResponse:\n"
    - "Instruction:\nWhat is water made of?\n\nResponse:\n"

  log_dir: logs/hierarchical_tool_sft
  log_every_n_steps: 25
