# MIKU Phase 7 - Expanded Tool-Calling SFT Configuration
# Fine-tunes canonical Phase 6 tool checkpoint on 9 tools + 2:1 conversational replay

model:
  preset: tiny
  vocab_size: 32000
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  weight_tie_embeddings: true
  rope_theta: 10000.0

tokenizer:
  model_prefix: data/processed/tokenizer/miku_bpe
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995

data:
  train_jsonl: data/processed/sft_tool/train_tool.jsonl
  val_jsonl: data/processed/sft_tool/val_tool.jsonl
  max_seq_len: 256

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  num_workers: 0

  optimizer: adamw
  learning_rate: 8.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  lr_warmup_steps: 50
  lr_min_factor: 0.1
  max_steps: 600

  dtype: auto
  checkpoint_dir: checkpoints/phase7_tool_sft
  checkpoint_every_n_steps: 50
  sample_every_n_steps: 50
  sample_max_new_tokens: 30
  sample_temperature: 0.7
  sample_top_p: 0.9
  sample_prompts:
    - "Instruction:\nWhat's my battery percentage?\n\nResponse:\n"
    - "Instruction:\nWhat day is it today?\n\nResponse:\n"
    - "Instruction:\nList the running applications.\n\nResponse:\n"
    - "Instruction:\nClose the calculator.\n\nResponse:\n"
    - "Instruction:\nWhat is the capital of Japan?\n\nResponse:\n"

  log_dir: logs/phase7_tool_sft
  log_every_n_steps: 25
