# MIKU Phase 4 - Supervised Instruction Tuning (SFT) Configuration
# STATUS: READY — Fine-tunes canonical Stage A tiny checkpoint on Databricks Dolly-15k

# -- Model ---------------------------------------------------------------------
model:
  preset: tiny
  vocab_size: 32000
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  weight_tie_embeddings: true
  rope_theta: 10000.0

# -- Tokenizer -----------------------------------------------------------------
tokenizer:
  model_prefix: data/processed/tokenizer/miku_bpe
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995

# -- SFT Data ------------------------------------------------------------------
data:
  train_jsonl: data/processed/sft/train_sft.jsonl
  val_jsonl: data/processed/sft/val_sft.jsonl
  max_seq_len: 256

# -- Training ------------------------------------------------------------------
training:
  batch_size: 8
  gradient_accumulation_steps: 2
  num_workers: 0

  optimizer: adamw
  learning_rate: 2.0e-4          # 1/5th of pretraining LR (1.0e-3) for gentle SFT adaptation
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  lr_warmup_steps: 100
  lr_min_factor: 0.1
  max_steps: 2500                # ~3.2 epochs over Dolly-15k (14k examples @ batch 16 = 880 steps/epoch)

  dtype: auto
  checkpoint_dir: checkpoints/phase4_sft
  checkpoint_every_n_steps: 100
  sample_every_n_steps: 100
  sample_max_new_tokens: 64
  sample_temperature: 0.7
  sample_top_p: 0.9
  sample_prompts:
    - "Instruction:\nWhat is the capital of France?\n\nResponse:\n"
    - "Instruction:\nSummarize the water cycle in one sentence.\n\nResponse:\n"
    - "Instruction:\nList three facts about France.\n\nResponse:\n"
    - "Instruction:\nWrite a short greeting to a friend.\n\nResponse:\n"

  log_dir: logs/phase4_sft
  log_every_n_steps: 25
