# MIKU Stage A - Clean Corpus Retrain (Task 3)
# STATUS: EXPERIMENTAL
#
# Full retrain from scratch on the clean (WikiText detokenized) corpus.
# Identical hyperparameters to the original 1500-step run, except:
#   - corpus is the post-fix version (no @-@ @.@ @,@ artifacts)
#   - tokenizer is retrained on the clean corpus
#   - checkpoints go to a separate directory for clean comparison
#
# Expected change: WikiText artifact tokens removed from vocabulary and
# training signal. Encyclopedic generations should no longer produce
# @-@ @.@ tokens. All other conditions held constant.

model:
  preset: tiny
  vocab_size: 32000
  n_layers: 4
  n_heads: 4
  d_model: 256
  d_ff: 1024
  max_seq_len: 256
  dropout: 0.1
  weight_tie_embeddings: true
  rope_theta: 10000.0

tokenizer:
  model_prefix: data/processed/tokenizer/miku_bpe
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_bin: data/processed/train.bin
  val_bin: data/processed/val.bin
  train_txt: data/processed/corpus_train.txt
  val_txt: data/processed/corpus_val.txt
  stats_json: data/processed/stats.json
  val_fraction: 0.05
  shuffle_seed: 42
  target_mix:
    reasoning_logic_arithmetic: 0.40
    general_text: 0.35
    encyclopedic: 0.25

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  optimizer: adamw
  learning_rate: 6.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  lr_warmup_steps: 80
  lr_min_factor: 0.1
  max_steps: 1500

  dtype: auto
  checkpoint_dir: checkpoints/stage_a_clean
  checkpoint_every_n_steps: 100

  sample_every_n_steps: 100
  sample_max_new_tokens: 64
  sample_temperature: 0.8
  sample_top_k: 50
  sample_top_p: 0.95
  sample_prompts:
    - "Step by step, let me solve"
    - "The capital city of France is"
    - "Once upon a time, in a small village"
    - "If a train travels at 60 mph"

  log_dir: logs/stage_a_clean
  log_every_n_steps: 25

eval:
  eval_every_n_steps: 100
  eval_max_batches: 15
  max_new_tokens: 128
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  held_out_prompts:
    - "If a train travels at 60 mph for 2 hours, how far does it go?"
    - "What is the logical conclusion if all A are B and all B are C?"
    - "Describe the water cycle in simple terms."
    - "Write a short paragraph about autumn leaves."
    - "What is 17 multiplied by 13?"
    - "Explain why 1 + 1 = 2 in a mathematical sense."
